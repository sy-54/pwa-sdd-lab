<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ミニアプリ</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ミニアプリ" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)" />
    <link rel="stylesheet" href="sdk/sdk.css" />
    <link rel="stylesheet" href="launcher/launcher.css" />
  </head>
  <body>
    <header class="sdk-header">
      <h1>ミニアプリ</h1>
      <button class="secondary" data-testid="settings-open" aria-label="設定" aria-expanded="false">設定</button>
    </header>
    <main data-testid="launcher-root">
      <section class="card" data-testid="settings-panel" hidden>
        <h2>データ</h2>
        <button data-testid="export-data">すべてのデータを書き出す</button>
        <label>バックアップから取り込む<input type="file" accept="application/json,.json" data-testid="import-data" /></label>
        <p class="muted">バージョン <span data-testid="app-version">―</span></p>
      </section>
      <nav class="tiles" data-testid="app-list" aria-label="アプリ一覧"></nav>
      <p class="muted" data-testid="app-empty" hidden>アプリがありません</p>
    </main>
    <script type="module" src="launcher/launcher.js"></script>
  </body>
</html>
